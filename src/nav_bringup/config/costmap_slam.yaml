# 边建图边导航模式: 无需 static map, 两个 costmap 都用 rolling_window
global_costmap:
  global_frame: map
  robot_base_frame: base_footprint
  update_frequency: 2.0
  publish_frequency: 1.0
  static_map: false
  rolling_window: true
  width: 30.0
  height: 30.0
  resolution: 0.05
  track_unknown_space: true
  plugins:
    - {name: obstacle_layer, type: "costmap_2d::ObstacleLayer"}
    - {name: inflation_layer, type: "costmap_2d::InflationLayer"}
  obstacle_layer:
    observation_sources: scan
    scan: {data_type: LaserScan, topic: /scan, marking: true, clearing: true, obstacle_range: 5.0, raytrace_range: 6.0}
  inflation_layer:
    inflation_radius: 0.15
    cost_scaling_factor: 5.0

local_costmap:
  global_frame: map
  robot_base_frame: base_footprint
  update_frequency: 5.0
  publish_frequency: 2.0
  static_map: false
  rolling_window: true
  width: 5.0
  height: 5.0
  resolution: 0.05
  plugins:
    - {name: obstacle_layer, type: "costmap_2d::ObstacleLayer"}
    - {name: inflation_layer, type: "costmap_2d::InflationLayer"}
  obstacle_layer:
    observation_sources: scan
    scan: {data_type: LaserScan, topic: /scan, marking: true, clearing: true, obstacle_range: 5.0, raytrace_range: 6.0}
  inflation_layer:
    inflation_radius: 0.15
    cost_scaling_factor: 5.0
