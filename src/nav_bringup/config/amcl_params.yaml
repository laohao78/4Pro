# AMCL 定位参数 (Ackermann 前轮转向)
# 坐标系
odom_frame_id: odom
base_frame_id: base_footprint
global_frame_id: map
use_map_topic: true

# 粒子数 (沙盘不大, 500 够了)
min_particles: 500
max_particles: 2000

# 初始位姿 (地图坐标系)
initial_pose_x: 0.0
initial_pose_y: 0.0
initial_pose_a: 0.0

# 更新频率
update_min_d: 0.05
update_min_a: 0.1

# 激光模型
laser_min_range: 0.3
laser_max_range: 10.0
laser_model_type: likelihood_field
laser_likelihood_max_dist: 2.0

# 里程计模型 (差分模式, 前轮转向用这个近似)
odom_model_type: diff
odom_alpha1: 0.2
odom_alpha2: 0.2
odom_alpha3: 0.2
odom_alpha4: 0.2

# 重采样
resample_interval: 1
transform_tolerance: 0.5
recovery_alpha_slow: 0.0
recovery_alpha_fast: 0.0
