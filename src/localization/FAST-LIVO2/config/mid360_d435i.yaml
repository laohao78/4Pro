common:
  img_topic: "/synced_image"
  lid_topic: "/synced_lidar"
  imu_topic: "/livox/imu"
  img_en: 1
  lidar_en: 1
  ros_driver_bug_fix: false

extrin_calib:
  extrinsic_T: [0.04412, -0.02329, -0.011]   # IMU -> LiDAR translation (from mid360 config)
  extrinsic_R: [1, 0, 0, 0, 1, 0, 0, 0, 1]   # IMU -> LiDAR rotation (identity, same IMU)
  Rcl: [0, -1, 0,                             # LiDAR -> Camera rotation (placeholder, 需 FAST-Calib 标定)
        -1, 0, 0,
        0, 0, -1]
  Pcl: [0.13, 0.0, -0.05]                     # LiDAR -> Camera translation (placeholder, 需 FAST-Calib 标定)

time_offset:
  imu_time_offset: 0.0
  img_time_offset: 0.0                         # sync_node 已处理时间同步，无需补偿
  exposure_time_init: 0.0

preprocess:
  point_filter_num: 1
  filter_size_surf: 0.5
  lidar_type: 1              # Livox LiDAR
  scan_line: 4               # MID360 = 4 线
  blind: 0.5

vio:
  max_iterations: 5
  outlier_threshold: 1000
  img_point_cov: 100
  patch_size: 8
  patch_pyrimid_level: 4
  normal_en: true
  raycast_en: false
  inverse_composition_en: false
  exposure_estimate_en: true
  inv_expo_cov: 0.1

imu:
  imu_en: true
  imu_int_frame: 30
  acc_cov: 0.1
  gyr_cov: 0.1
  b_acc_cov: 0.0001
  b_gyr_cov: 0.0001

lio:
  max_iterations: 5
  dept_err: 0.02
  beam_err: 0.05
  min_eigen_value: 0.0025
  voxel_size: 0.5
  max_layer: 2
  max_points_num: 50
  layer_init_num: [5, 5, 5, 5, 5]

local_map:
  map_sliding_en: false
  half_map_size: 100
  sliding_thresh: 8

uav:
  imu_rate_odom: false
  gravity_align_en: false

publish:
  dense_map_en: true
  pub_effect_point_en: false
  pub_plane_en: false
  pub_scan_num: 1
  blind_rgb_points: 0.0

evo:
  seq_name: "mid360_d435i"
  pose_output_en: false

pcd_save:
  pcd_save_en: false
  type: 0
  colmap_output_en: false
  filter_size_pcd: 0.15
  interval: -1

image_save:
  img_save_en: false
  interval: 1
